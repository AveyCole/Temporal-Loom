<section id="typePanel" class="type-panel" hidden>
 <div class="type-heading"><h2>Type fragments</h2><button type="button" id="closeType">Back to deck</button></div>
 <div class="type-composer">
  <div class="type-form">
   <label for="typeWords">Words or phrases</label>
   <textarea id="typeWords" rows="3" maxlength="1200" placeholder="Type something"></textarea>
   <label for="typeFont">Font</label>
   <div class="type-font-picker">
    <select id="typeFont"></select>
    <button type="button" id="prevTypeFont" aria-label="Previous font" title="Previous font">‹</button>
    <button type="button" id="nextTypeFont" aria-label="Next font" title="Next font">›</button>
   </div>
   <div class="type-grid">
    <label>Split into <select id="typeSplit"><option value="phrase">One fragment</option><option value="lines">One per line</option><option value="words">One per word</option></select></label>
    <label>Weight <select id="typeWeight"><option value="300">Light</option><option value="400" selected>Regular</option><option value="600">Semibold</option><option value="700">Bold</option><option value="900">Black</option></select></label>
    <label>Lettering <select id="typeLettering"><option>Solid</option><option>Outline</option><option>Offset print</option><option>Shadow</option></select></label>
    <label>Background <select id="typeTexture"><option>Solid</option><option>Gradient</option><option>Paper grain</option><option>Halftone</option><option>Scanlines</option></select></label>
    <label>Placement <select id="typePlacement"><option value="center">Centered</option><option value="left">Left</option><option value="right">Right</option><option value="top">Top</option><option value="bottom">Bottom</option></select></label>
    <label>Size (%) <input id="typeSize" type="number" min="4" max="95" value="42" step="1"></label>
    <label>Tracking (px) <input id="typeTracking" type="number" min="-12" max="80" value="0" step="1"></label>
    <label>Line spacing (%) <input id="typeLeading" type="number" min="70" max="200" value="100" step="5"></label>
    <label>Rotation (°) <input id="typeAngle" type="number" min="-180" max="180" value="0" step="1"></label>
   </div>
   <div class="type-colors"><label>Ink <input id="typeInk" type="color" value="#d6fa82"></label><label>Paper <input id="typePaper" type="color" value="#101817"></label><label>Accent <input id="typeAccent" type="color" value="#fe697c"></label></div>
   <div class="type-switches"><label><input id="typeCaps" type="checkbox"> All caps</label><label><input id="typeItalic" type="checkbox"> Italic</label></div>
   <label>Import a font <input id="typeFontFile" type="file" accept=".ttf,.otf,.woff,.woff2,font/*"></label>
  </div>
  <div class="type-proof">
   <canvas id="typePreview" width="640" height="400" aria-label="Type fragment preview"></canvas>
   <div class="type-actions"><button type="button" class="primary" id="addType">Add to deck</button><button type="button" id="cancelTypeEdit" hidden>Cancel edit</button></div>
   <p id="typeStatus" role="status"></p>
  </div>
 </div>
</section>
