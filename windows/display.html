<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'">
<title>Temporal Loom Display</title>
<style>
 html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}
 canvas{display:block;width:100%;height:100%;object-fit:contain}
 html.fullscreen{cursor:none}
</style>
</head>
<body>
<canvas aria-label="Temporal Loom live visuals"></canvas>
<script>
const output=document.querySelector('canvas'),context=output.getContext('2d',{alpha:false});
const send=message=>window.chrome.webview.postMessage(message);
window.presentStage=source=>{
 if(output.width!==source.width||output.height!==source.height){
   output.width=source.width;
   output.height=source.height;
 }
 context.drawImage(source,0,0);
};
window.addEventListener('keydown',event=>{
 if(event.key!=='F11'&&event.key!=='Escape')return;
 event.preventDefault();
 if(!event.repeat)send(event.key==='F11'?'toggleFullscreen':'exitFullscreen');
});
output.addEventListener('dblclick',()=>send('toggleFullscreen'));
document.addEventListener('visibilitychange',()=>window.opener?.updateStageFrameClock());
window.opener?.displayConnected(window);
</script>
</body>
</html>
